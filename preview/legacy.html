<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>legacy era sites</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
  .win{width:1280px;height:800px;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .bar{height:40px;flex:0 0 40px;background:#e9eaee;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #d7d8de}
  .dot{width:12px;height:12px;border-radius:50%}.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .url{margin-left:12px;font:13px ui-monospace,monospace;color:#7a7c86;background:#fff;border-radius:6px;padding:5px 14px;flex:1}
  .view{flex:1;overflow:hidden;position:relative}

  /* ---------- 1998 GEOCITIES ---------- */
  .e98{height:100%;background:#087 repeating-linear-gradient(45deg,#0a8 0 12px,#087 12px 24px);font-family:"Times New Roman",serif;color:#fff;text-align:center;padding:16px}
  .e98 .marq{background:#000080;color:#ff0;font-size:16px;padding:5px 0;white-space:nowrap;overflow:hidden}
  .e98 h1{font-size:44px;color:#ff0;text-shadow:3px 3px 0 #c00;margin:14px 0 2px}
  .e98 .sub{color:#0ff;font-style:italic;font-size:20px}
  .e98 .constr{display:inline-block;background:#ff0;color:#000;font-weight:700;font-size:15px;padding:8px 16px;border:4px dashed #000;transform:rotate(-3deg);margin:14px}
  .e98 .cols{display:flex;gap:16px;justify-content:center;text-align:left}
  .e98 .box{background:#fff;color:#000;border:3px ridge #ccc;padding:10px 16px;font-size:16px;min-width:230px}
  .e98 .box h3{color:#008;border-bottom:1px solid #999;margin-bottom:6px}.e98 .box a{color:#00e;text-decoration:underline;display:block;margin:2px 0}
  .e98 .cnt{margin-top:16px;font-size:15px}.e98 .cnt b{background:#000;color:#0f0;font-family:monospace;padding:3px 6px;letter-spacing:4px}
  .e98 .ns{margin-top:12px;font-size:13px;color:#ff0}

  /* ---------- 2003 TABLE LAYOUT ---------- */
  .e03{height:100%;background:#fff;font-family:Verdana,Geneva,sans-serif;font-size:13px;color:#333;display:flex;flex-direction:column}
  .e03 .banner{background:linear-gradient(#356,#123);color:#fff;padding:18px 20px;border-bottom:4px solid #fc0}
  .e03 .banner h1{font-size:30px;font-family:Georgia,serif}.e03 .banner .t{color:#9cf;font-size:13px}
  .e03 .body{flex:1;display:flex}
  .e03 .nav{width:180px;background:#eef;padding:12px;border-right:2px solid #99c}
  .e03 .nav a{display:block;background:#dde;border:2px outset #fff;padding:7px 10px;margin-bottom:6px;color:#036;text-decoration:none;font-weight:700}
  .e03 .main{flex:1;padding:20px}.e03 .main h2{color:#036;border-bottom:2px solid #ccc;margin-bottom:8px}
  .e03 .main p{line-height:1.6;margin-bottom:10px}
  .e03 .hit{margin-top:16px;font-size:11px;color:#888}.e03 .hit b{background:#111;color:#0f0;font-family:monospace;padding:2px 5px}
  .e03 .foot{background:#123;color:#89b;text-align:center;padding:8px;font-size:11px}
  .e03 .clip{float:right;width:120px;height:90px;background:#cde;border:1px solid #99c;margin:0 0 8px 12px;display:flex;align-items:center;justify-content:center;font-size:40px}

  /* ---------- 2008 WEB 2.0 GLOSSY ---------- */
  .e08{height:100%;background:linear-gradient(#eaf1f8,#cdddf0);font-family:'Lucida Grande','Segoe UI',Arial,sans-serif;color:#334;padding:0}
  .e08 .top{background:linear-gradient(#5a9bd6,#2f6ca8);padding:16px 26px;border-bottom:1px solid #16456f;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;gap:14px}
  .e08 .logo{font-size:28px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .e08 .beta{background:#fc3;color:#630;font-weight:700;font-size:11px;padding:3px 8px;border-radius:10px;box-shadow:inset 0 1px 0 #fff}
  .e08 .nav{margin-left:auto;display:flex;gap:6px}
  .e08 .nav a{background:linear-gradient(#fff,#dbe6f2);border:1px solid #9bb;border-radius:8px;padding:7px 14px;color:#25567f;text-decoration:none;font-weight:700;font-size:13px;box-shadow:inset 0 1px 0 #fff}
  .e08 .hero{padding:30px 26px}.e08 .hero h1{font-size:34px;color:#1c4e7f;text-shadow:0 1px 0 #fff}
  .e08 .hero p{font-size:15px;color:#557;margin:8px 0 16px;max-width:60ch}
  .e08 .gel{display:inline-block;background:linear-gradient(#7dc24b,#4e8a2a);color:#fff;font-weight:800;font-size:16px;padding:12px 26px;border-radius:22px;border:1px solid #3a6a1e;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 4px rgba(0,0,0,.3);text-shadow:0 -1px 0 rgba(0,0,0,.3)}
  .e08 .cards{display:flex;gap:14px;padding:0 26px}
  .e08 .card{flex:1;background:#fff;border:1px solid #bcd;border-radius:12px;padding:14px;box-shadow:0 2px 6px rgba(30,70,120,.15)}
  .e08 .card h3{color:#2b6aa5;font-size:16px}.e08 .card .rib{display:inline-block;background:#e33;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;margin-top:6px}

  /* ---------- 2013 BOOTSTRAP JUMBOTRON ---------- */
  .e13{height:100%;background:#fff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#333;display:flex;flex-direction:column}
  .e13 .nb{background:#f8f8f8;border-bottom:1px solid #e7e7e7;padding:14px 22px;display:flex;align-items:center;gap:18px}
  .e13 .nb .brand{font-size:20px;font-weight:700;color:#555}.e13 .nb a{color:#777;text-decoration:none;font-size:14px}.e13 .nb .sp{flex:1}
  .e13 .jumbo{background:#eee;padding:40px 30px;margin:20px;border-radius:6px}
  .e13 .jumbo h1{font-size:44px;font-weight:200;color:#333}.e13 .jumbo p{font-size:18px;color:#777;margin:12px 0 18px;font-weight:300}
  .e13 .btn{display:inline-block;background:#428bca;color:#fff;padding:14px 24px;border-radius:5px;font-size:17px;text-decoration:none}
  .e13 .row{display:flex;gap:20px;padding:0 30px}
  .e13 .col{flex:1}.e13 .col h3{font-weight:400;color:#333}.e13 .col p{color:#777;font-size:13px;line-height:1.5}
  .e13 .dots{text-align:center;margin-top:14px}.e13 .dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ccc;margin:0 4px}.e13 .dots i.on{background:#428bca}

  /* ---------- 2017 TEMPLATE (full-bleed hero) ---------- */
  .e17{height:100%;position:relative;font-family:'Montserrat','Segoe UI',Arial,sans-serif;color:#fff;background:#1c1c1c}
  .e17 .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.5) saturate(.8)}
  .e17 .nav{position:relative;display:flex;align-items:center;padding:20px 30px;z-index:2}
  .e17 .nav .b{font-weight:800;letter-spacing:2px;font-size:18px;text-transform:uppercase}.e17 .nav .sp{flex:1}
  .e17 .nav .burger{font-size:24px}.e17 .nav a{color:#ddd;text-decoration:none;margin-left:18px;font-size:12px;letter-spacing:2px;text-transform:uppercase}
  .e17 .center{position:relative;z-index:2;height:calc(100% - 66px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .e17 .center .pre{letter-spacing:5px;font-size:12px;color:#ccc;text-transform:uppercase}
  .e17 .center h1{font-weight:200;font-size:58px;letter-spacing:3px;margin:10px 0}
  .e17 .center .line{width:60px;height:2px;background:#c9a34b;margin:14px 0}
  .e17 .center .btn{border:1px solid #fff;color:#fff;padding:13px 30px;text-decoration:none;letter-spacing:3px;font-size:12px;text-transform:uppercase;margin-top:8px}
</style></head>
<body><div class="win" id="win"></div>
<script>
var DATA=[
 {era:0,year:'1998',url:'sunrisebakery.geocities.com/home.htm',name:'Sunrise Bakery & Cafe',menu:['Fresh Bread','Danishes','Coffee & Tea','Birthday Cakes'],tag:'~*~ Welcome to our homepage ~*~',icon:'🥐',blurb:'Freshly baked goods daily! Come visit our little shop on Main Street.'},
 {era:1,year:'2003',url:'angelfire.com/food/rollingfresh',name:'Rolling Fresh Taco Truck',menu:['Tacos','Burritos','Quesadillas','Aguas Frescas'],tag:'Serving the neighborhood since 2001',icon:'🌮',blurb:'Check this page for where our truck is parked today. Call ahead for large orders!'},
 {era:2,year:'2008',url:'sharpcobarbers.com',name:'Sharp & Co. Barbers',menu:['Haircuts','Hot Shaves','Beard Trims','Kids Cuts'],tag:'Classic cuts, walk-ins welcome',icon:'💈',blurb:'Your neighborhood barbershop since 1994. Now booking appointments by phone!'},
 {era:3,year:'2013',url:'crispcleaners.com',name:'Crisp Cleaners',menu:['Dry Cleaning','Wash & Fold','Alterations','Leather Care'],tag:'Your neighborhood dry cleaner',icon:'👔',blurb:'Fast, affordable dry cleaning with same-day service. Now with online coupons.'},
 {era:4,year:'2017',url:'osterianonna.com',name:'Osteria Nonna',menu:['Antipasti','Pasta','Secondi','Dolci'],tag:'Handmade Italian, family recipes',icon:'🍝',blurb:'Authentic Italian dining in a warm, family atmosphere.',bg:'store_restaurant.png'}
];
var era=parseInt(new URLSearchParams(location.search).get('era')||'0',10);
var d=DATA[era]||DATA[0];
var win=document.getElementById('win');
function bar(u){return '<div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="url">'+(era>=2?'http://www.':'http://www.')+u+'</span></div>';}
var body='';
if(era===0){
  body='<div class="view"><div class="e98"><div class="marq">★ '+d.blurb+' ★ tell your friends! ★</div>'
   +'<h1>'+d.name+'</h1><div class="sub">'+d.tag+'</div>'
   +'<div class="constr">🚧 UNDER CONSTRUCTION 🚧</div>'
   +'<div class="cols"><div class="box"><h3>Our Menu</h3>'+d.menu.map(m=>'<a>» '+m+'</a>').join('')+'</div>'
   +'<div class="box"><h3>Visit Us</h3>Mon–Sat 6am–2pm<br>Sun: CLOSED<br>Call: 555-0147</div></div>'
   +'<div class="cnt">You are visitor number: <b>0014273</b></div>'
   +'<div class="ns">Best viewed in Netscape Navigator 4.0 at 800×600</div></div></div>';
}else if(era===1){
  body='<div class="view"><div class="e03"><div class="banner"><h1>'+d.name+'</h1><div class="t">'+d.tag+'</div></div>'
   +'<div class="body"><div class="nav">'+['Home','Menu','Locations','Catering','Contact'].map(x=>'<a>'+x+'</a>').join('')+'</div>'
   +'<div class="main"><div class="clip">'+d.icon+'</div><h2>Welcome to our website!</h2><p>'+d.blurb+'</p>'
   +'<p><b>Our Menu:</b> '+d.menu.join(', ')+'.</p><p>Bookmark this page and check back for our daily locations. We update it every morning!</p>'
   +'<div class="hit">You are visitor <b>00008120</b> · Best viewed at 1024×768</div></div></div>'
   +'<div class="foot">© 2003 '+d.name+' · webmaster@'+d.url.split("/")[0]+'</div></div></div>';
}else if(era===2){
  body='<div class="view"><div class="e08"><div class="top"><span class="logo">'+d.name+'</span><span class="beta">BETA</span>'
   +'<span class="nav">'+['Home','Services','About','Contact'].map(x=>'<a>'+x+'</a>').join('')+'</span></div>'
   +'<div class="hero"><h1>Welcome to '+d.name+'</h1><p>'+d.blurb+'</p><a class="gel">Book Now ›</a></div>'
   +'<div class="cards">'+d.menu.slice(0,3).map((m,i)=>'<div class="card"><h3>'+m+'</h3><p>Quality service you can count on.</p>'+(i===0?'<span class="rib">POPULAR</span>':'')+'</div>').join('')+'</div></div></div>';
}else if(era===3){
  body='<div class="view"><div class="e13"><div class="nb"><span class="brand">'+d.name+'</span><span class="sp"></span>'
   +['Home','Services','Pricing','Contact'].map(x=>'<a>'+x+'</a>').join(' &nbsp; ')+'</div>'
   +'<div class="jumbo"><h1>'+d.name+'</h1><p>'+d.blurb+'</p><a class="btn">Get Started »</a></div>'
   +'<div class="row">'+d.menu.slice(0,3).map(m=>'<div class="col"><h3>'+m+'</h3><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Fast and reliable.</p></div>').join('')+'</div>'
   +'<div class="dots"><i class="on"></i><i></i><i></i></div></div></div>';
}else{
  body='<div class="view"><div class="e17"><div class="bg" style="background-image:url(\''+(d.bg||'')+'\')"></div>'
   +'<div class="nav"><span class="b">'+d.name+'</span><span class="sp"></span>'
   +['Menu','About','Reservations','Contact'].map(x=>'<a>'+x+'</a>').join('')+'<span class="burger">&#9776;</span></div>'
   +'<div class="center"><div class="pre">'+d.tag+'</div><h1>'+d.name+'</h1><div class="line"></div><a class="btn">View Menu</a></div></div></div>';
}
win.innerHTML=bar(d.url)+body;
</script>
</body></html>
